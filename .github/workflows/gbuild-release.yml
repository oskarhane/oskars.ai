# Release pipeline for the gbuild plugin (npm package `opencode-gbuild`).
# One manual dispatch from the Actions tab bumps both manifests in lockstep,
# gates on the full test suite, publishes to npm with provenance, and only
# then lands the release on git. npm publish runs before any git push so a
# failure before it leaves nothing behind (re-dispatch retries cleanly); if
# the publish itself succeeded but a later step failed, npm already has the
# version — finish the missing git steps by hand rather than re-dispatching.
name: gbuild release

on:
  workflow_dispatch:
    inputs:
      level:
        description: Semver level to bump gbuild's two manifests by.
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]

# One release at a time: a dispatch while another is still running waits in
# the queue instead of racing it; an in-flight release is never cancelled.
concurrency:
  group: gbuild-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # push the bump commit + tag, create the GitHub Release
      id-token: write # OIDC token for npm publish --provenance
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        # Always release main, whatever branch the dispatch was started from.
        with:
          ref: main
          # Full history: the bump commit is pushed back to main afterwards.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # Writes the .npmrc that maps NODE_AUTH_TOKEN to the npm registry.
          registry-url: https://registry.npmjs.org

      - name: Install repo dev dependencies
        # tsx, for `node --import tsx --test` in plugins/gbuild/ below.
        run: npm ci

      - name: Install the cypherlite CLI
        # The Cypher-layer tests drive the real binary; without it they skip.
        # Verified release-signature installer, to ~/.local/bin.
        run: |
          curl -sSfL https://neo4j-labs.github.io/cypherlite/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Bump both manifests in lockstep
        id: bump
        working-directory: plugins/gbuild
        env:
          LEVEL: ${{ inputs.level }}
        run: |
          # stdout is the new semver alone; a nonzero exit (manifest version
          # drift, bad level) fails the release before anything is published
          # or pushed. The captured version is the single source of truth for
          # every later step: commit message, tag name, release, publish.
          version="$(node scripts/bump-versions.mjs "$LEVEL")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Released gbuild ${version} (${LEVEL})" >> "$GITHUB_STEP_SUMMARY"

      - name: Run the gbuild test suite
        # A test failure fails the release before npm or git is touched.
        working-directory: plugins/gbuild
        run: node --import tsx --test

      - name: Commit the bump
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins/gbuild/package.json plugins/gbuild/.claude-plugin/plugin.json
          git commit -m "chore(gbuild): release ${VERSION}"

      - name: Publish to npm with provenance
        # Runs before any git push: a publish failure leaves git untouched,
        # so the same dispatch can simply be retried.
        working-directory: plugins/gbuild
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          # Refuse to publish unless the manifest still holds the captured
          # bump version.
          test "$(node -p "require('./package.json').version")" = "$VERSION"
          npm publish --provenance

      - name: Push the bump commit and tag
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          # The release now lands on git in one push: the commit on main and
          # its tag together.
          git tag "gbuild-v${VERSION}"
          git push origin "HEAD:refs/heads/main" "refs/tags/gbuild-v${VERSION}"

      - name: Open the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: gh release create "gbuild-v${VERSION}" --title "gbuild-v${VERSION}" --generate-notes
